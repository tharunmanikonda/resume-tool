name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-tool-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app and extension
        run: npm run build

      - name: Check the main review UI contract
        run: node tests/main_review_ui_smoke.mjs

      - name: Check Python syntax
        run: python -m py_compile app.py resume_mcp/server.py resume_mcp/service.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the deployment script
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519

          # Match the pinned key material, then bind it to the exact host name
          # used by this workflow. This supports a key captured by IP while
          # DEPLOY_HOST uses a DNS name, without trusting an unverified scan.
          expected_key="$(
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" |
              tr -d '\r' |
              awk '{
                for (field = 1; field <= NF; field += 1) {
                  if ($field == "ssh-ed25519" && field < NF) {
                    print $(field + 1)
                    exit
                  }
                }
                if (NF == 1 && $1 ~ /^AAAAC3NzaC1lZDI1NTE5/) {
                  print $1
                  exit
                }
              }'
          )"
          if [[ -z "$expected_key" ]]; then
            echo "DEPLOY_KNOWN_HOSTS must contain an ED25519 known-hosts line or its Base64 key body."
            exit 1
          fi
          scanned_line="$(ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" 2>/dev/null | awk '$2 == "ssh-ed25519" { print; exit }')"
          scanned_key="$(printf '%s\n' "$scanned_line" | awk '{ print $3 }')"
          if [[ -z "$scanned_key" || "$scanned_key" != "$expected_key" ]]; then
            echo "The server ED25519 key does not match DEPLOY_KNOWN_HOSTS."
            exit 1
          fi
          if [[ "$DEPLOY_PORT" == "22" ]]; then
            known_host="$DEPLOY_HOST"
          else
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          printf '%s ssh-ed25519 %s\n' "$known_host" "$expected_key" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null

      - name: Deploy the pushed commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE_USER: ${{ secrets.DEPLOY_SERVICE_USER }}
          DEPLOY_WEB_SERVICE: ${{ secrets.DEPLOY_WEB_SERVICE }}
          DEPLOY_MCP_SERVICE: ${{ secrets.DEPLOY_MCP_SERVICE }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/resume-tool}"
          DEPLOY_SERVICE_USER="${DEPLOY_SERVICE_USER:-$DEPLOY_USER}"
          DEPLOY_WEB_SERVICE="${DEPLOY_WEB_SERVICE:-resume-tool-web.service}"
          DEPLOY_MCP_SERVICE="${DEPLOY_MCP_SERVICE:-resume-tool-mcp.service}"
          printf -v remote_command \
            'APP_DIR=%q REPO_URL=%q RESUME_SERVICE_USER=%q WEB_SERVICE=%q MCP_SERVICE=%q bash -s -- %q' \
            "$DEPLOY_PATH" \
            "$REPO_URL" \
            "$DEPLOY_SERVICE_USER" \
            "$DEPLOY_WEB_SERVICE" \
            "$DEPLOY_MCP_SERVICE" \
            "$REVISION"
          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command" < ops/deploy_server.sh
