name: Daily job monitors

on:
  schedule:
    # 7:00 AM and 4:00 PM Central Standard Time (13:00 and 22:00 UTC).
    # During daylight-saving time these fixed UTC schedules run at 8 AM and 5 PM CDT.
    - cron: "0 13,22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-job-monitors
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out monitor state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all programmatic monitors
        id: monitors
        continue-on-error: true
        run: python job_monitor_batch.py

      - name: Publish the daily summary
        if: always()
        run: cat docs/job-monitor-runs/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check for new candidates
        if: always()
        id: candidates
        run: |
          python - <<'PY'
          import json
          import os

          report = json.load(open("docs/job-monitor-runs/latest.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"found={'true' if report['candidate_count'] else 'false'}\n")
              output.write(f"count={report['candidate_count']}\n")
              output.write(f"scanned_at={report['scanned_at']}\n")
          PY

      - name: Open a GitHub issue for new matches
        if: steps.candidates.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_COUNT: ${{ steps.candidates.outputs.count }}
          SCANNED_AT: ${{ steps.candidates.outputs.scanned_at }}
        run: |
          gh label create job-monitor \
            --color "1D76DB" \
            --description "New matching roles found by the scheduled monitors" \
            --force
          gh issue create \
            --title "New job matches: ${MATCH_COUNT} found at ${SCANNED_AT}" \
            --body-file docs/job-monitor-runs/latest.md \
            --label job-monitor

      - name: Commit successful state updates and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*-job-monitor-state.json docs/job-monitor-runs/latest.json docs/job-monitor-runs/latest.md
          if git diff --cached --quiet; then
            echo "No monitor state changed."
            exit 0
          fi
          git commit -m "chore: update daily job monitor state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail when any source failed
        if: steps.monitors.outcome == 'failure'
        run: exit 1
